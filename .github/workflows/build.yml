
name: Build LixeSMP

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -o LixeSMP-GitHub-Build-Ready.zip -d project
          echo "Project files:"
          find project -maxdepth 5 -type f | head -200
