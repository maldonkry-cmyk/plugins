
name: Build LixeSMP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project
        run: unzip -o LixeSMP-GitHub-Build-Ready.zip -d project

      - name: Build plugin
        run: |
          set -e
          if find project -name gradlew -type f | grep -q .; then
            WRAPPER=$(find project -name gradlew -type f | head -1)
            cd "$(dirname "$WRAPPER")"
            chmod +x gradlew
            ./gradlew build
          elif find project -name pom.xml -type f | grep -q .; then
            POM=$(find project -name pom.xml -type f | head -1)
            mvn -B -f "$POM" package
          elif find project \( -name build.gradle -o -name build.gradle.kts \) -type f | grep -q .; then
            echo "Gradle project found, but no Gradle wrapper exists."
            exit 1
          else
            echo "No Gradle or Maven build configuration found."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LixeSMP-JAR
          path: |
            project/**/build/libs/*.jar
            project/**/target/*.jar
          if-no-files-found: error
